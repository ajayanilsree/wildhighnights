{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="min-h-screen bg-whn-dark pt-32 pb-20 px-6">
    <div class="container mx-auto max-w-2xl">
        <!-- Header -->
        <div class="mb-16" data-aos="fade-down">
            <a href="{% url 'dashboard' %}" class="text-whn-purple font-bold tracking-[0.3em] uppercase text-[10px] mb-4 flex items-center gap-2 hover:translate-x-[-4px] transition-transform">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
                Back to Dashboard
            </a>
            <h1 class="text-5xl md:text-6xl font-black text-white tracking-tighter">New Artist</h1>
        </div>

        <!-- Form Card -->
        <div class="glass-card rounded-[2.5rem] p-10 md:p-12 border border-white/5 shadow-2xl" data-aos="fade-up">
            <form method="POST" enctype="multipart/form-data" class="space-y-8">
                {% csrf_token %}
                
                <!-- Artist Name -->
                <div class="relative group">
                    <label class="text-[10px] font-bold text-whn-tertiary uppercase tracking-[0.2em] ml-1 mb-3 block group-focus-within:text-whn-purple transition-colors">Artist Name</label>
                    <input type="text" name="name" required placeholder="e.g. DJ Paroma" class="w-full bg-white/[0.03] border border-white/10 rounded-2xl px-6 py-4 text-white focus:outline-none focus:border-whn-purple/50 focus:ring-4 focus:ring-whn-purple/10 transition-all placeholder:text-white/10">
                </div>

                <!-- Genre -->
                <div class="relative group">
                    <label class="text-[10px] font-bold text-whn-tertiary uppercase tracking-[0.2em] ml-1 mb-3 block group-focus-within:text-whn-purple transition-colors">Genre</label>
                    <input type="text" name="genre" required placeholder="e.g. Techno, Afro House, Bollywood, Hip-Hop" class="w-full bg-white/[0.03] border border-white/10 rounded-2xl px-6 py-4 text-white focus:outline-none focus:border-whn-purple/50 focus:ring-4 focus:ring-whn-purple/10 transition-all placeholder:text-white/10">
                </div>

                <!-- Artist Picture -->
                <div class="relative group">
                    <label class="text-[10px] font-bold text-whn-tertiary uppercase tracking-[0.2em] ml-1 mb-3 block group-focus-within:text-whn-purple transition-colors">Artist Picture</label>
                    <div class="relative">
                        <!-- Transparent file input positioned on top (z-20) to intercept general click events -->
                        <input type="file" id="artist_image" name="artist_image" accept=".jpg,.jpeg,.png,.webp" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20">
                        
                        <div class="w-full bg-white/[0.03] border border-white/10 border-dashed rounded-2xl px-6 py-8 text-center group-hover:border-whn-purple/50 transition-all">
                            <!-- 1. Placeholder State -->
                            <div id="placeholder-container" class="transition-all duration-300">
                                <div class="text-3xl mb-2">📸</div>
                                <p class="text-xs text-whn-tertiary font-bold uppercase tracking-widest">Click to upload artist photo</p>
                                <p class="text-[8px] text-white/20 mt-2 uppercase tracking-widest">JPG, PNG, WEBP ONLY</p>
                            </div>

                            <!-- 2. Preview State (Hidden by default) -->
                            <div id="preview-container" class="hidden flex flex-col items-center justify-center transition-all duration-300">
                                <!-- Success Badge -->
                                <div class="flex items-center gap-2 mb-4 bg-emerald-500/10 border border-emerald-500/20 px-4 py-1.5 rounded-full">
                                    <span class="text-emerald-400 text-xs">✓</span>
                                    <span class="text-[9px] font-bold text-emerald-400 uppercase tracking-widest">Image Selected</span>
                                </div>
                                
                                <!-- Image Thumbnail -->
                                <div class="relative w-36 h-36 rounded-2xl overflow-hidden border border-white/10 shadow-lg mb-4 hover:border-whn-purple/50 transition-colors">
                                    <img id="image-preview" src="" alt="Preview" class="w-full h-full object-cover">
                                </div>
                                
                                <!-- File Info and Action Buttons -->
                                <div class="text-center w-full max-w-xs">
                                    <p id="filename-text" class="text-xs text-white font-medium truncate mb-3 px-4"></p>
                                    <div class="flex items-center justify-center gap-3">
                                        <!-- Buttons marked with relative z-30 so they intercept click events instead of the z-20 transparent input -->
                                        <button type="button" id="btn-change-image" class="relative z-30 px-4 py-2 rounded-xl bg-white/5 border border-white/10 text-[9px] font-bold text-whn-tertiary uppercase tracking-widest hover:bg-whn-purple/20 hover:border-whn-purple/50 hover:text-white transition-all">
                                            Change Image
                                        </button>
                                        <button type="button" id="btn-remove-image" class="relative z-30 p-2 rounded-xl bg-red-500/10 border border-red-500/25 text-red-400 hover:bg-red-500/20 hover:border-red-500/50 hover:text-white transition-all" title="Remove Image">
                                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Username & Password -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="relative group">
                        <label class="text-[10px] font-bold text-whn-tertiary uppercase tracking-[0.2em] ml-1 mb-3 block group-focus-within:text-whn-purple transition-colors">Username</label>
                        <input type="text" name="username" required placeholder="Login username" class="w-full bg-white/[0.03] border border-white/10 rounded-2xl px-6 py-4 text-white focus:outline-none focus:border-whn-purple/50 focus:ring-4 focus:ring-whn-purple/10 transition-all placeholder:text-white/10">
                    </div>
                    <div class="relative group">
                        <label class="text-[10px] font-bold text-whn-tertiary uppercase tracking-[0.2em] ml-1 mb-3 block group-focus-within:text-whn-purple transition-colors">Password</label>
                        <input type="password" name="password" required placeholder="••••••••" class="w-full bg-white/[0.03] border border-white/10 rounded-2xl px-6 py-4 text-white focus:outline-none focus:border-whn-purple/50 focus:ring-4 focus:ring-whn-purple/10 transition-all placeholder:text-white/10">
                    </div>
                </div>

                <!-- Instagram -->
                <div class="relative group">
                    <label class="text-[10px] font-bold text-whn-tertiary uppercase tracking-[0.2em] ml-1 mb-3 block group-focus-within:text-whn-purple transition-colors">Instagram ID / Profile Link</label>
                    <input type="text" name="instagram" placeholder="e.g. whn_artist or https://instagram.com/whn_artist" class="w-full bg-white/[0.03] border border-white/10 rounded-2xl px-6 py-4 text-white focus:outline-none focus:border-whn-purple/50 focus:ring-4 focus:ring-whn-purple/10 transition-all placeholder:text-white/10">
                </div>

                <!-- Submit -->
                <div class="pt-6">
                    <button type="submit" class="w-full py-5 bg-gradient-to-r from-whn-purple to-whn-blue text-white font-black tracking-[0.2em] rounded-2xl hover:scale-[1.02] active:scale-[0.98] transition-all shadow-[0_0_40px_rgba(124,58,237,0.3)] hover:shadow-[0_0_60px_rgba(124,58,237,0.5)]">
                        ADD ARTIST
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const fileInput = document.getElementById('artist_image');
        const placeholderContainer = document.getElementById('placeholder-container');
        const previewContainer = document.getElementById('preview-container');
        const imagePreview = document.getElementById('image-preview');
        const filenameText = document.getElementById('filename-text');
        const btnChange = document.getElementById('btn-change-image');
        const btnRemove = document.getElementById('btn-remove-image');

        fileInput.addEventListener('change', function(e) {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    imagePreview.src = event.target.result;
                    filenameText.textContent = file.name;
                    placeholderContainer.classList.add('hidden');
                    previewContainer.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            } else {
                imagePreview.src = '';
                filenameText.textContent = '';
                placeholderContainer.classList.remove('hidden');
                previewContainer.classList.add('hidden');
            }
        });

        btnChange.addEventListener('click', (e) => {
            e.stopPropagation();
            fileInput.click();
        });

        btnRemove.addEventListener('click', (e) => {
            e.stopPropagation();
            fileInput.value = '';
            fileInput.dispatchEvent(new Event('change'));
        });
    });
</script>
{% endblock %}
