{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="min-h-screen bg-whn-dark pt-32 pb-20 px-6">
    <div class="container mx-auto max-w-2xl">
        <!-- Header -->
        <div class="mb-16" data-aos="fade-down">
            <a href="{% url 'manage_events' %}" class="text-whn-purple font-bold tracking-[0.3em] uppercase text-[10px] mb-4 flex items-center gap-2 hover:translate-x-[-4px] transition-transform">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
                Back to Events
            </a>
            <h1 class="text-5xl md:text-6xl font-black text-white tracking-tighter">Edit Event</h1>
            <p class="text-whn-tertiary text-sm mt-4">Updating details for <span class="text-white font-bold">{{ event.event_name }}</span></p>
        </div>

        <!-- Form Card -->
        <div class="glass-card rounded-[2.5rem] p-10 md:p-12 border border-white/5 shadow-2xl" data-aos="fade-up">
            <form method="POST" enctype="multipart/form-data" class="space-y-8">
                {% csrf_token %}
                
                <!-- Event Name -->
                <div class="relative group">
                    <label class="text-[10px] font-bold text-whn-tertiary uppercase tracking-[0.2em] ml-1 mb-3 block group-focus-within:text-whn-purple transition-colors">Event Name</label>
                    <input type="text" name="event_name" required value="{{ event.event_name }}" class="w-full bg-white/[0.03] border border-white/10 rounded-2xl px-6 py-4 text-white focus:outline-none focus:border-whn-purple/50 focus:ring-4 focus:ring-whn-purple/10 transition-all">
                </div>

                <!-- Date & Time -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="relative group">
                        <label class="text-[10px] font-bold text-whn-tertiary uppercase tracking-[0.2em] ml-1 mb-3 block group-focus-within:text-whn-purple transition-colors">Event Date</label>
                        <input type="date" name="event_date" required value="{{ event.event_date|date:'Y-m-d' }}" class="w-full bg-white/[0.03] border border-white/10 rounded-2xl px-6 py-4 text-white focus:outline-none focus:border-whn-purple/50 focus:ring-4 focus:ring-whn-purple/10 transition-all">
                    </div>
                    <div class="relative group">
                        <label class="text-[10px] font-bold text-whn-tertiary uppercase tracking-[0.2em] ml-1 mb-3 block group-focus-within:text-whn-purple transition-colors">Event Time</label>
                        <input type="time" name="event_time" required value="{{ event.event_time|time:'H:i' }}" class="w-full bg-white/[0.03] border border-white/10 rounded-2xl px-6 py-4 text-white focus:outline-none focus:border-whn-purple/50 focus:ring-4 focus:ring-whn-purple/10 transition-all">
                    </div>
                </div>

                <!-- Venue & Location -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="relative group">
                        <label class="text-[10px] font-bold text-whn-tertiary uppercase tracking-[0.2em] ml-1 mb-3 block group-focus-within:text-whn-purple transition-colors">Venue Name</label>
                        <input type="text" name="venue_name" required value="{{ event.venue_name }}" class="w-full bg-white/[0.03] border border-white/10 rounded-2xl px-6 py-4 text-white focus:outline-none focus:border-whn-purple/50 focus:ring-4 focus:ring-whn-purple/10 transition-all">
                    </div>
                    <div class="relative group">
                        <label class="text-[10px] font-bold text-whn-tertiary uppercase tracking-[0.2em] ml-1 mb-3 block group-focus-within:text-whn-purple transition-colors">Location</label>
                        <input type="text" name="location" required value="{{ event.location }}" class="w-full bg-white/[0.03] border border-white/10 rounded-2xl px-6 py-4 text-white focus:outline-none focus:border-whn-purple/50 focus:ring-4 focus:ring-whn-purple/10 transition-all">
                    </div>
                </div>

                <!-- Event Image -->
                <div class="relative group">
                    <label class="text-[10px] font-bold text-whn-tertiary uppercase tracking-[0.2em] ml-1 mb-3 block group-focus-within:text-whn-purple transition-colors">Event Image</label>
                    <div class="flex items-center gap-6 mb-4">
                        {% if event.event_image %}
                        <div class="w-24 h-16 rounded-xl overflow-hidden border border-white/10">
                            <img src="{{ event.event_image.url }}" alt="{{ event.event_name }}" class="w-full h-full object-cover">
                        </div>
                        {% endif %}
                        <div class="flex-1 relative">
                            <input type="file" name="event_image" accept=".jpg,.jpeg,.png,.webp" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                            <div class="w-full bg-white/[0.03] border border-white/10 border-dashed rounded-2xl px-6 py-6 text-center group-hover:border-whn-purple/50 transition-all">
                                <p class="text-[10px] text-whn-tertiary font-bold uppercase tracking-widest">Update Thumbnail</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Status -->
                <div class="relative group">
                    <label class="text-[10px] font-bold text-whn-tertiary uppercase tracking-[0.2em] ml-1 mb-3 block group-focus-within:text-whn-purple transition-colors">Status</label>
                    <select name="status" class="w-full bg-white/[0.03] border border-white/10 rounded-2xl px-6 py-4 text-white focus:outline-none focus:border-whn-purple/50 focus:ring-4 focus:ring-whn-purple/10 transition-all appearance-none cursor-pointer">
                        <option value="Published" {% if event.status == 'Published' %}selected{% endif %} class="bg-whn-dark text-white">Published</option>
                        <option value="Draft" {% if event.status == 'Draft' %}selected{% endif %} class="bg-whn-dark text-white">Draft</option>
                    </select>
                </div>

                <!-- Submit -->
                <div class="pt-6">
                    <button type="submit" class="w-full py-5 bg-gradient-to-r from-whn-purple to-whn-blue text-white font-black tracking-[0.2em] rounded-2xl hover:scale-[1.02] active:scale-[0.98] transition-all shadow-[0_0_40px_rgba(124,58,237,0.3)] hover:shadow-[0_0_60px_rgba(124,58,237,0.5)]">
                        UPDATE EVENT
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
