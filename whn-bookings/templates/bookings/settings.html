{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="min-h-screen bg-whn-dark pt-32 pb-20 px-6">
    <div class="container mx-auto max-w-3xl">
        <!-- Header -->
        <div class="mb-16" data-aos="fade-down">
            <a href="{% url 'dashboard' %}" class="text-whn-purple font-bold tracking-[0.3em] uppercase text-[10px] mb-4 flex items-center gap-2 hover:translate-x-[-4px] transition-transform">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
                Back to Dashboard
            </a>
            <h1 class="text-5xl md:text-6xl font-black text-white tracking-tighter">Advanced Settings</h1>
        </div>

        <!-- Form Card -->
        <div class="glass-card rounded-[2.5rem] p-10 md:p-12 border border-white/5 shadow-2xl" data-aos="fade-up">
            <form method="POST" class="space-y-10">
                {% csrf_token %}
                
                <!-- Branding Section -->
                <div>
                    <h3 class="text-white font-bold text-lg mb-8 flex items-center gap-3">
                        <span class="w-2 h-2 rounded-full bg-whn-purple shadow-[0_0_10px_rgba(124,58,237,1)]"></span>
                        Brand Identity
                    </h3>
                    <div class="space-y-6">
                        <div class="relative group">
                            <label class="text-[10px] font-bold text-whn-tertiary uppercase tracking-[0.2em] ml-1 mb-3 block group-focus-within:text-whn-purple transition-colors">Website Title</label>
                            <input type="text" name="title" value="{{ settings.title }}" required class="w-full bg-white/[0.03] border border-white/10 rounded-2xl px-6 py-4 text-white focus:outline-none focus:border-whn-purple/50 focus:ring-4 focus:ring-whn-purple/10 transition-all">
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="relative group">
                                <label class="text-[10px] font-bold text-whn-tertiary uppercase tracking-[0.2em] ml-1 mb-3 block group-focus-within:text-whn-purple transition-colors">Instagram URL</label>
                                <input type="url" name="instagram_link" value="{{ settings.instagram_link }}" required class="w-full bg-white/[0.03] border border-white/10 rounded-2xl px-6 py-4 text-white focus:outline-none focus:border-whn-purple/50 focus:ring-4 focus:ring-whn-purple/10 transition-all">
                            </div>
                            <div class="relative group">
                                <label class="text-[10px] font-bold text-whn-tertiary uppercase tracking-[0.2em] ml-1 mb-3 block group-focus-within:text-whn-purple transition-colors">Contact Email</label>
                                <input type="email" name="contact_email" value="{{ settings.contact_email }}" required class="w-full bg-white/[0.03] border border-white/10 rounded-2xl px-6 py-4 text-white focus:outline-none focus:border-whn-purple/50 focus:ring-4 focus:ring-whn-purple/10 transition-all">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Content Section -->
                <div>
                    <h3 class="text-white font-bold text-lg mb-8 flex items-center gap-3">
                        <span class="w-2 h-2 rounded-full bg-whn-blue shadow-[0_0_10px_rgba(0,122,255,1)]"></span>
                        Homepage Content
                    </h3>
                    <div class="space-y-6">
                        <div class="relative group">
                            <label class="text-[10px] font-bold text-whn-tertiary uppercase tracking-[0.2em] ml-1 mb-3 block group-focus-within:text-whn-purple transition-colors">Hero Subheading</label>
                            <textarea name="hero_text" rows="3" required class="w-full bg-white/[0.03] border border-white/10 rounded-2xl px-6 py-4 text-white focus:outline-none focus:border-whn-purple/50 focus:ring-4 focus:ring-whn-purple/10 transition-all resize-none">{{ settings.hero_text }}</textarea>
                        </div>
                        <div class="relative group">
                            <label class="text-[10px] font-bold text-whn-tertiary uppercase tracking-[0.2em] ml-1 mb-3 block group-focus-within:text-whn-purple transition-colors">Footer Description</label>
                            <textarea name="footer_description" rows="3" required class="w-full bg-white/[0.03] border border-white/10 rounded-2xl px-6 py-4 text-white focus:outline-none focus:border-whn-purple/50 focus:ring-4 focus:ring-whn-purple/10 transition-all resize-none">{{ settings.footer_description }}</textarea>
                        </div>
                    </div>
                </div>

                <!-- Submit -->
                <div class="pt-6">
                    <button type="submit" class="w-full py-5 bg-gradient-to-r from-whn-purple to-whn-blue text-white font-black tracking-[0.2em] rounded-2xl hover:scale-[1.02] active:scale-[0.98] transition-all shadow-[0_0_40px_rgba(124,58,237,0.3)] hover:shadow-[0_0_60px_rgba(124,58,237,0.5)]">
                        SAVE CONFIGURATION
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
