<nav id="navbar" class="fixed top-0 left-0 right-0 z-[100] transition-all duration-300 px-6 py-4">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
        <!-- Logo -->
        <a href="/" class="flex items-center gap-2 group">
            <span class="text-2xl font-black tracking-tighter text-white group-hover:text-whn-purple transition-colors">WHN</span>
            <span class="hidden md:block text-xs font-bold tracking-[0.2em] text-whn-purple uppercase mt-1">Wild High Nights</span>
        </a>

        <!-- Desktop Links -->
        <div class="hidden md:flex items-center gap-8">
            <a href="/#events" class="text-sm font-semibold text-white/70 hover:text-white transition-colors">Events</a>
            <a href="/#artists" class="text-sm font-semibold text-white/70 hover:text-white transition-colors">Artists</a>
            <a href="/#about" class="text-sm font-semibold text-white/70 hover:text-white transition-colors">About</a>
            {% if user.is_authenticated %}
            <a href="{% url 'dashboard' %}" class="px-6 py-2 rounded-full bg-whn-purple text-white text-sm font-bold shadow-[0_0_20px_rgba(124,58,237,0.3)] transition-all duration-300 scale-100 hover:scale-105 active:scale-95">
                Dashboard
            </a>
            {% else %}
            <a href="{% url 'login' %}" class="px-6 py-2 rounded-full glass border border-whn-purple/30 text-sm font-bold hover:bg-whn-purple hover:text-white hover:shadow-[0_0_20px_rgba(124,58,237,0.5)] transition-all duration-300 scale-100 hover:scale-105 active:scale-95">
                Login
            </a>
            {% endif %}
        </div>

        <!-- Mobile Menu Toggle -->
        <button id="menuToggle" class="md:hidden text-white p-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
            </svg>
        </button>
    </div>

    <!-- Mobile Menu -->
    <div id="mobileMenu" class="fixed inset-0 bg-whn-dark/95 backdrop-blur-xl z-[101] flex flex-col items-center justify-center gap-8 transition-transform duration-500 translate-x-full">
        <button id="closeMenu" class="absolute top-6 right-6 text-white p-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
        <a href="/#events" class="text-3xl font-bold hover:text-whn-purple transition-colors mobile-link">Events</a>
        <a href="/#artists" class="text-3xl font-bold hover:text-whn-purple transition-colors mobile-link">Artists</a>
        <a href="/#about" class="text-3xl font-bold hover:text-whn-purple transition-colors mobile-link">About</a>
        {% if user.is_authenticated %}
        <a href="{% url 'dashboard' %}" class="mt-4 px-10 py-3 rounded-full bg-whn-purple text-white text-xl font-bold transition-all mobile-link">Dashboard</a>
        {% else %}
        <a href="{% url 'login' %}" class="mt-4 px-10 py-3 rounded-full glass border border-whn-purple/50 text-xl font-bold hover:bg-whn-purple hover:text-white transition-all mobile-link">Login</a>
        {% endif %}
    </div>
</nav>

<script>
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
        if (window.scrollY > 50) {
            navbar.classList.add('glass', 'py-3');
            navbar.classList.remove('py-4');
        } else {
            navbar.classList.remove('glass', 'py-3');
            navbar.classList.add('py-4');
        }
    });

    const menuToggle = document.getElementById('menuToggle');
    const closeMenu = document.getElementById('closeMenu');
    const mobileMenu = document.getElementById('mobileMenu');
    const mobileLinks = document.querySelectorAll('.mobile-link');

    const toggleMenu = () => mobileMenu.classList.toggle('translate-x-full');

    menuToggle.addEventListener('click', toggleMenu);
    closeMenu.addEventListener('click', toggleMenu);
    mobileLinks.forEach(link => link.addEventListener('click', toggleMenu));
</script>
