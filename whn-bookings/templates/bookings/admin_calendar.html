{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="min-h-screen bg-whn-dark pt-32 pb-20 px-4 md:px-6">
    <div class="container mx-auto max-w-7xl">
        <!-- Back navigation & Header -->
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-12" data-aos="fade-down">
            <div>
                <a href="{% url 'dashboard' %}" class="text-whn-purple font-bold tracking-[0.3em] uppercase text-[10px] mb-4 flex items-center gap-2 hover:translate-x-[-4px] transition-transform w-fit">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                    Back to Dashboard
                </a>
                <span class="text-whn-purple font-bold tracking-[0.3em] uppercase text-[10px] mb-2 block">Admin Planner</span>
                <h1 class="text-5xl md:text-6xl font-black text-white tracking-tighter">Master Calendar</h1>
            </div>
            
            <!-- Calendar Controls -->
            <div class="flex items-center gap-3">
                <button id="todayBtn" class="px-5 py-2.5 rounded-xl glass border border-white/10 text-xs font-bold text-white hover:bg-white/5 active:scale-95 transition-all uppercase tracking-wider">
                    Today
                </button>
                <div class="flex items-center rounded-xl glass border border-white/10 p-1">
                    <button id="prevMonth" class="p-2 text-white/70 hover:text-white hover:bg-white/5 rounded-lg transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                        </svg>
                    </button>
                    <button id="nextMonth" class="p-2 text-white/70 hover:text-white hover:bg-white/5 rounded-lg transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Dropdown & Color Legend Header -->
        <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-6 mb-8" data-aos="fade-up">
            <!-- Artist Selector Dropdown -->
            <div class="flex flex-col md:flex-row md:items-center gap-4">
                <label for="artistSelect" class="text-[10px] text-whn-tertiary font-bold uppercase tracking-widest">Filter by Artist:</label>
                <select id="artistSelect" class="px-6 py-3.5 rounded-2xl bg-white/[0.03] border border-white/10 text-white font-black text-xs tracking-wider focus:border-whn-purple/50 focus:outline-none transition-all cursor-pointer">
                    {% for artist in artists %}
                    <option value="{{ artist.id }}" class="bg-whn-dark text-white">{{ artist.name }}</option>
                    {% empty %}
                    <option value="" class="bg-whn-dark text-white">No active artists found</option>
                    {% endfor %}
                </select>
            </div>
            
            <!-- Color Legend -->
            <div class="flex flex-wrap items-center gap-6 p-4 rounded-2xl bg-white/[0.02] border border-white/5 text-xs font-bold tracking-wider">
                <div class="flex items-center gap-2">
                    <span class="w-3.5 h-3.5 rounded-full bg-green-500/20 border border-green-500/50 shadow-[0_0_10px_rgba(34,197,94,0.3)]"></span>
                    <span class="text-white/80">Confirmed Booking</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-3.5 h-3.5 rounded-full bg-yellow-500/20 border border-yellow-500/50 shadow-[0_0_10px_rgba(234,179,8,0.3)]"></span>
                    <span class="text-white/80">Tentative Booking</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-3.5 h-3.5 rounded-full bg-whn-purple/20 border border-whn-purple/50 shadow-[0_0_10px_rgba(124,58,237,0.3)]"></span>
                    <span class="text-white/80">Busy / Unavailable</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-3.5 h-3.5 rounded-full bg-white/[0.02] border border-white/10"></span>
                    <span class="text-white/40">Available Date</span>
                </div>
            </div>
        </div>

        <!-- Monthly Grid Header Label -->
        <h2 id="currentMonthYear" class="text-3xl md:text-4xl font-black text-white tracking-tight mb-6" data-aos="fade-up">Loading Calendar...</h2>

        <!-- Monthly Grid Card -->
        <div class="glass-card rounded-[2.5rem] border border-white/5 p-4 md:p-8 overflow-hidden shadow-2xl relative" data-aos="fade-up">
            <!-- Days of Week Header -->
            <div class="grid grid-cols-7 text-center text-xs font-black tracking-widest text-whn-tertiary uppercase pb-4 mb-4 border-b border-white/5">
                <div>Sun</div>
                <div>Mon</div>
                <div>Tue</div>
                <div>Wed</div>
                <div>Thu</div>
                <div>Fri</div>
                <div>Sat</div>
            </div>

            <!-- Calendar Cells Grid -->
            <div id="calendarGrid" class="grid grid-cols-7 gap-2 md:gap-3 min-h-[500px]">
                <!-- Days will be dynamically loaded via JS -->
            </div>
        </div>
    </div>
</div>

<!-- Scheduler Interaction Modal (Read-Only Overview for Admin) -->
<div id="calendarModal" class="fixed inset-0 z-[150] hidden flex items-center justify-center p-4 bg-whn-dark/80 backdrop-blur-md opacity-0 transition-opacity duration-300">
    <div class="glass-card w-full max-w-lg rounded-[2.5rem] border border-white/10 p-8 md:p-10 shadow-[0_0_50px_rgba(124,58,237,0.15)] transform scale-95 transition-transform duration-300">
        <!-- Close Button -->
        <button id="closeModal" class="absolute top-6 right-6 text-white/50 hover:text-white p-2 rounded-full hover:bg-white/5 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>

        <!-- Modal Dynamic Header -->
        <div class="mb-6">
            <span id="modalDateLabel" class="text-whn-purple font-bold tracking-[0.3em] uppercase text-[10px] mb-2 block">DATE DETAILS</span>
            <h3 id="modalTitle" class="text-3xl font-black text-white leading-tight tracking-tight">Manage Availability</h3>
        </div>

        <!-- Dynamic Body Content -->
        <div id="modalBody" class="space-y-6">
            <!-- Dynamic forms/details are loaded dynamically -->
        </div>
    </div>
</div>

<!-- Inline CSS to style the responsive calendar grid -->
<style>
    .calendar-cell {
        min-height: 95px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
    }
    @media (max-width: 768px) {
        .calendar-cell {
            min-height: 70px;
        }
    }
    .calendar-cell:hover:not(.empty-cell) {
        transform: translateY(-2px);
        background-color: rgba(255, 255, 255, 0.04);
        border-color: rgba(124, 58, 237, 0.3);
    }
    .calendar-cell.today-cell {
        border-color: #7C3AED !important;
        box-shadow: 0 0 15px rgba(124, 58, 237, 0.2);
    }
    /* Cell State Colors */
    .cell-booking-confirmed {
        background-color: rgba(34, 197, 94, 0.08) !important;
        border-color: rgba(34, 197, 94, 0.3) !important;
    }
    .cell-booking-confirmed:hover {
        border-color: rgba(34, 197, 94, 0.6) !important;
        background-color: rgba(34, 197, 94, 0.12) !important;
    }
    .cell-booking-tentative {
        background-color: rgba(234, 179, 8, 0.08) !important;
        border-color: rgba(234, 179, 8, 0.3) !important;
    }
    .cell-booking-tentative:hover {
        border-color: rgba(234, 179, 8, 0.6) !important;
        background-color: rgba(234, 179, 8, 0.12) !important;
    }
    .cell-busy {
        background-color: rgba(124, 58, 237, 0.08) !important;
        border-color: rgba(124, 58, 237, 0.3) !important;
    }
    .cell-busy:hover {
        border-color: rgba(124, 58, 237, 0.6) !important;
        background-color: rgba(124, 58, 237, 0.12) !important;
    }
</style>

<!-- Calendar Orchestration Script -->
<script>
    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth(); // 0-indexed
    let calendarEvents = { bookings: [], busy_dates: [] };
    let selectedDate = null;
    
    // DOM selectors
    const prevMonthBtn = document.getElementById('prevMonth');
    const nextMonthBtn = document.getElementById('nextMonth');
    const todayBtn = document.getElementById('todayBtn');
    const currentMonthYearLabel = document.getElementById('currentMonthYear');
    const calendarGrid = document.getElementById('calendarGrid');
    const artistSelect = document.getElementById('artistSelect');
    
    const calendarModal = document.getElementById('calendarModal');
    const modalCard = calendarModal.querySelector('.glass-card');
    const closeModalBtn = document.getElementById('closeModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalDateLabel = document.getElementById('modalDateLabel');
    const modalBody = document.getElementById('modalBody');

    // Fetch and initialize events
    async function loadEventsAndRender() {
        const selectedArtistId = artistSelect ? artistSelect.value : '';
        if (!selectedArtistId) {
            calendarEvents = { bookings: [], busy_dates: [] };
            renderArtistMonthlyCalendar();
            return;
        }
        
        try {
            const response = await fetch(`/api/artist/calendar/?artist_id=${selectedArtistId}`);
            if (!response.ok) throw new Error('Failed to fetch events');
            calendarEvents = await response.json();
            renderArtistMonthlyCalendar();
        } catch (error) {
            console.error('Error loading calendar events:', error);
            calendarEvents = { bookings: [], busy_dates: [] };
            renderArtistMonthlyCalendar();
        }
    }

    // Modal helpers (immediate close with flex/hidden toggling)
    function showModal() {
        calendarModal.classList.remove('hidden');
        calendarModal.classList.add('flex', 'active', 'show', 'open');
        calendarModal.querySelector('.glass-card')?.classList.add('active', 'show', 'open');
        document.body.classList.add('modal-open');
        
        setTimeout(() => {
            calendarModal.classList.remove('opacity-0');
            modalCard.classList.remove('scale-95');
        }, 10);
    }

    function closeModal() {
        calendarModal.classList.add('hidden', 'opacity-0');
        calendarModal.classList.remove('flex', 'active', 'show', 'open');
        calendarModal.querySelector('.glass-card')?.classList.remove('active', 'show', 'open');
        document.body.classList.remove('modal-open');
        
        // Reset selected date label and textarea value upon closure
        modalDateLabel.innerText = '';
        selectedDate = null;
    }

    closeModalBtn.addEventListener('click', closeModal);
    calendarModal.addEventListener('click', (e) => {
        if (e.target === calendarModal) closeModal();
    });

    // Render Calendar
    function renderArtistMonthlyCalendar() {
        // Clear grid
        calendarGrid.innerHTML = '';
        
        // Update month-year label
        const monthNames = [
            "January", "February", "March", "April", "May", "June",
            "July", "August", "September", "October", "November", "December"
        ];
        currentMonthYearLabel.innerText = `${monthNames[currentMonth]} ${currentYear}`;
        
        // Days calculation
        const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay(); // Day of week (0-6)
        const totalDaysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        
        // Populate previous month padding cells
        for (let i = 0; i < firstDayIndex; i++) {
            const emptyCell = document.createElement('div');
            emptyCell.className = "calendar-cell empty-cell rounded-2xl bg-white/[0.01] border border-white/[0.02] cursor-not-allowed opacity-30";
            calendarGrid.appendChild(emptyCell);
        }
        
        // Populate actual days
        const today = new Date();
        const isCurrentMonth = today.getFullYear() === currentYear && today.getMonth() === currentMonth;
        
        // Safely extract arrays or default to empty
        const bookingsList = (calendarEvents && calendarEvents.bookings) || [];
        const busyList = (calendarEvents && calendarEvents.busy_dates) || [];
        
        for (let day = 1; day <= totalDaysInMonth; day++) {
            const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const cell = document.createElement('div');
            
            // Build base classes
            cell.className = "calendar-cell p-3 rounded-2xl bg-white/[0.02] border border-white/5 flex flex-col justify-between";
            
            // Highlight today
            if (isCurrentMonth && today.getDate() === day) {
                cell.classList.add('today-cell');
            }
            
            // Safe find checks
            const booking = bookingsList.find(b => b.date === dateStr);
            const busy = busyList.find(b => b.date === dateStr);
            
            // Render day number
            let cellContent = `<span class="text-sm font-black text-white/50 block mb-1 text-right">${day}</span>`;
            
            if (booking) {
                if (booking.status === 'Confirmed') {
                    cell.classList.add('cell-booking-confirmed');
                    cellContent += `
                        <div class="flex-1 flex flex-col justify-end">
                            <span class="text-[9px] font-black text-green-400 bg-green-500/10 px-2 py-1 rounded-lg block truncate max-w-full text-center tracking-widest uppercase">
                                ✅ ${booking.venue}
                            </span>
                        </div>
                    `;
                } else {
                    cell.classList.add('cell-booking-tentative');
                    cellContent += `
                        <div class="flex-1 flex flex-col justify-end">
                            <span class="text-[9px] font-black text-yellow-400 bg-yellow-500/10 px-2 py-1 rounded-lg block truncate max-w-full text-center tracking-widest uppercase">
                                ⏳ ${booking.venue}
                            </span>
                        </div>
                    `;
                }
            } else if (busy) {
                cell.classList.add('cell-busy');
                cellContent += `
                    <div class="flex-1 flex flex-col justify-end">
                        <span class="text-[9px] font-black text-whn-purple bg-whn-purple/10 px-2 py-1 rounded-lg block truncate max-w-full text-center tracking-widest uppercase">
                            🔴 Busy
                        </span>
                    </div>
                `;
            }
            
            cell.innerHTML = cellContent;
            
            // Grid interaction click handler
            cell.addEventListener('click', () => handleCellClick(dateStr, booking, busy));
            calendarGrid.appendChild(cell);
        }
    }

    // Cell Click Interactions (Read-only Overview for administrators)
    function handleCellClick(dateStr, booking, busy) {
        selectedDate = dateStr;
        
        // Pretty Date presentation
        const dateObj = new Date(dateStr);
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const prettyDate = dateObj.toLocaleDateString('en-US', options);
        modalDateLabel.innerText = prettyDate;
        
        // State A: Booking details
        if (booking) {
            modalTitle.innerText = "Booking Overview";
            modalBody.innerHTML = `
                <div class="space-y-4">
                    <div class="p-4 rounded-xl bg-white/[0.03] border border-white/5">
                        <span class="text-[9px] text-whn-tertiary uppercase tracking-wider block mb-1">Event Venue & Details</span>
                        <h4 class="text-xl font-black text-white">${booking.venue}</h4>
                        <p class="text-xs text-white/50 mt-1">📍 ${booking.location}</p>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="p-4 rounded-xl bg-white/[0.03] border border-white/5">
                            <span class="text-[9px] text-whn-tertiary uppercase tracking-wider block mb-1">Time & Duration</span>
                            <span class="text-sm font-bold text-white">${booking.time} · ${booking.duration}</span>
                        </div>
                        <div class="p-4 rounded-xl bg-white/[0.03] border border-white/5">
                            <span class="text-[9px] text-whn-tertiary uppercase tracking-wider block mb-1">Show Type</span>
                            <span class="text-sm font-bold text-white">${booking.event_type}</span>
                        </div>
                    </div>
                    <div class="p-4 rounded-xl bg-white/[0.03] border border-white/5">
                        <span class="text-[9px] text-whn-tertiary uppercase tracking-wider block mb-1">Internal Remarks</span>
                        <p class="text-xs text-white/60 leading-relaxed">${booking.notes || 'No remarks provided by administrator.'}</p>
                    </div>
                </div>
            `;
        } 
        // State B: Marked Busy details
        else if (busy) {
            modalTitle.innerText = "Busy Availability";
            modalBody.innerHTML = `
                <div class="space-y-4">
                    <p class="text-sm text-whn-tertiary">The artist marked this date as unavailable/busy. Admins are cautioned when matching shows here.</p>
                    <div class="p-4 rounded-xl bg-white/[0.03] border border-white/5">
                        <span class="text-[9px] text-whn-tertiary uppercase tracking-wider block mb-1">Artist Notes</span>
                        <p class="text-xs text-white leading-relaxed whitespace-pre-line">${busy.note || 'No notes added.'}</p>
                    </div>
                </div>
            `;
        } 
        // State C: Available Free Date
        else {
            modalTitle.innerText = "Available Slot";
            modalBody.innerHTML = `
                <div class="space-y-4">
                    <p class="text-sm text-whn-tertiary">This date is completely open. No bookings or busy declarations have been posted by the performer.</p>
                    <div class="p-4 rounded-2xl bg-green-500/10 border border-green-500/20 text-green-400 text-xs font-bold flex items-center gap-2">
                        <span>✅</span> <span>Available for Booking Drafts</span>
                    </div>
                </div>
            `;
        }
        
        showModal();
    }

    // Dropdown change trigger
    if (artistSelect) {
        artistSelect.addEventListener('change', () => {
            loadEventsAndRender();
        });
    }

    // Month Navigation controls
    prevMonthBtn.addEventListener('click', () => {
        currentMonth--;
        if (currentMonth < 0) {
            currentMonth = 11;
            currentYear--;
        }
        renderArtistMonthlyCalendar();
    });

    nextMonthBtn.addEventListener('click', () => {
        currentMonth++;
        if (currentMonth > 11) {
            currentMonth = 0;
            currentYear++;
        }
        renderArtistMonthlyCalendar();
    });

    todayBtn.addEventListener('click', () => {
        const today = new Date();
        currentYear = today.getFullYear();
        currentMonth = today.getMonth();
        renderArtistMonthlyCalendar();
    });

    // Start initialization
    loadEventsAndRender();
</script>
{% endblock %}
