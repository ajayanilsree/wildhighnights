{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="min-h-screen bg-whn-dark pt-32 pb-20 px-6">
    <div class="container mx-auto max-w-2xl">
        <!-- Header -->
        <div class="mb-16" data-aos="fade-down">
            <a href="{% url 'manage_artists' %}" class="text-whn-purple font-bold tracking-[0.3em] uppercase text-[10px] mb-4 flex items-center gap-2 hover:translate-x-[-4px] transition-transform">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
                Back to Artists
            </a>
            <h1 class="text-5xl md:text-6xl font-black text-white tracking-tighter">Edit Artist</h1>
            <p class="text-whn-tertiary text-sm mt-4">Updating profile for <span class="text-white font-bold">{{ artist.name }}</span></p>
        </div>

        <!-- Form Card -->
        <div class="glass-card rounded-[2.5rem] p-10 md:p-12 border border-white/5 shadow-2xl" data-aos="fade-up">
            <form method="POST" enctype="multipart/form-data" class="space-y-8">
                {% csrf_token %}
                
                <!-- Artist Name -->
                <div class="relative group">
                    <label class="text-[10px] font-bold text-whn-tertiary uppercase tracking-[0.2em] ml-1 mb-3 block group-focus-within:text-whn-purple transition-colors">Artist Name</label>
                    <input type="text" name="name" required value="{{ artist.name }}" class="w-full bg-white/[0.03] border border-white/10 rounded-2xl px-6 py-4 text-white focus:outline-none focus:border-whn-purple/50 focus:ring-4 focus:ring-whn-purple/10 transition-all">
                </div>

                <!-- Genre -->
                <div class="relative group">
                    <label class="text-[10px] font-bold text-whn-tertiary uppercase tracking-[0.2em] ml-1 mb-3 block group-focus-within:text-whn-purple transition-colors">Genre</label>
                    <input type="text" name="genre" required value="{{ artist.genre }}" class="w-full bg-white/[0.03] border border-white/10 rounded-2xl px-6 py-4 text-white focus:outline-none focus:border-whn-purple/50 focus:ring-4 focus:ring-whn-purple/10 transition-all">
                </div>

                <!-- Artist Picture -->
                <div class="relative group">
                    <label class="text-[10px] font-bold text-whn-tertiary uppercase tracking-[0.2em] ml-1 mb-3 block group-focus-within:text-whn-purple transition-colors">Artist Picture</label>
                    <div class="flex items-center gap-6 mb-4">
                        {% if artist.artist_image %}
                        <div class="w-20 h-20 rounded-2xl overflow-hidden border border-white/10">
                            <img src="{{ artist.artist_image.url }}" alt="{{ artist.name }}" class="w-full h-full object-cover">
                        </div>
                        {% endif %}
                        <div class="flex-1 relative">
                            <input type="file" name="artist_image" accept=".jpg,.jpeg,.png,.webp" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                            <div class="w-full bg-white/[0.03] border border-white/10 border-dashed rounded-2xl px-6 py-6 text-center group-hover:border-whn-purple/50 transition-all">
                                <p class="text-[10px] text-whn-tertiary font-bold uppercase tracking-widest">Change Photo</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Username & Optional Password -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="relative group">
                        <label class="text-[10px] font-bold text-whn-tertiary uppercase tracking-[0.2em] ml-1 mb-3 block group-focus-within:text-whn-purple transition-colors">Username</label>
                        <input type="text" name="username" required value="{{ artist.user.username }}" class="w-full bg-white/[0.03] border border-white/10 rounded-2xl px-6 py-4 text-white focus:outline-none focus:border-whn-purple/50 focus:ring-4 focus:ring-whn-purple/10 transition-all">
                    </div>
                    <div class="relative group">
                        <label class="text-[10px] font-bold text-whn-tertiary uppercase tracking-[0.2em] ml-1 mb-3 block group-focus-within:text-whn-purple transition-colors">New Password (Optional)</label>
                        <input type="password" name="new_password" placeholder="••••••••" class="w-full bg-white/[0.03] border border-white/10 rounded-2xl px-6 py-4 text-white focus:outline-none focus:border-whn-purple/50 focus:ring-4 focus:ring-whn-purple/10 transition-all placeholder:text-white/10">
                    </div>
                </div>

                <!-- Instagram -->
                <div class="relative group">
                    <label class="text-[10px] font-bold text-whn-tertiary uppercase tracking-[0.2em] ml-1 mb-3 block group-focus-within:text-whn-purple transition-colors">Instagram ID / Profile Link</label>
                    <input type="text" name="instagram" value="{{ artist.instagram }}" class="w-full bg-white/[0.03] border border-white/10 rounded-2xl px-6 py-4 text-white focus:outline-none focus:border-whn-purple/50 focus:ring-4 focus:ring-whn-purple/10 transition-all">
                </div>

                <!-- Submit -->
                <div class="pt-6">
                    <button type="submit" class="w-full py-5 bg-gradient-to-r from-whn-purple to-whn-blue text-white font-black tracking-[0.2em] rounded-2xl hover:scale-[1.02] active:scale-[0.98] transition-all shadow-[0_0_40px_rgba(124,58,237,0.3)] hover:shadow-[0_0_60px_rgba(124,58,237,0.5)]">
                        UPDATE ARTIST
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
